name: 🚀 Build & Deploy to phionaaladina.com

on:
  push:
    branches:
      - main
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# never run two deploys at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🧪 Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔨 Build React app
        run: |
          npm ci
          CI=false GENERATE_SOURCEMAP=false npm run build

      # Repository secrets (Settings → Secrets and variables → Actions → Secrets):
      #   FTP_SERVER    e.g. ftp.phionaaladina.com
      #   FTP_USERNAME  your cPanel / FTP username
      #   FTP_PASSWORD  your cPanel / FTP password
      # Optional repository variable (… → Variables):
      #   FTP_SERVER_DIR  folder to upload into; defaults to ./public_html/
      # The host occasionally refuses new FTP data connections mid-upload
      # (connection limits), so the upload is retried up to twice after a pause.
      - name: 📂 Deploy via FTP to cPanel
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: ⏳ Wait before retrying
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: 📂 Deploy via FTP to cPanel (retry 1)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: ⏳ Wait before retrying
        if: steps.deploy2.outcome == 'failure'
        run: sleep 30

      - name: 📂 Deploy via FTP to cPanel (retry 2)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
